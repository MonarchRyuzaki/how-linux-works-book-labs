events {}
http {
    server {
        listen 443 ssl;
        server_name localhost;

        # BUG: Only the leaf cert is served. The intermediate CA cert is NOT bundled.
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
