# Starting config: plain HTTP only.
# You will update this file as part of the task to enable HTTPS.

events {}

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            root /var/www/html;
            index index.html;
        }
    }

    # --- You will add a second server block here for HTTPS ---
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            root /var/www/html;
            index index.html;
        }
    }
}
